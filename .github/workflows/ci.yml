name: Placement Portal CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

# Required for GitHub Container Registry
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      # -----------------------------
      # Student Portal
      # -----------------------------

      - name: Install Student Portal dependencies
        working-directory: ./student-portal
        run: npm ci

      - name: Build Student Portal
        working-directory: ./student-portal
        run: npm run build

      # -----------------------------
      # Admin Portal
      # -----------------------------

      - name: Install Admin Portal dependencies
        working-directory: ./admin-portal
        run: npm ci

      - name: Build Admin Portal
        working-directory: ./admin-portal
        run: npm run build

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm ci

      # -----------------------------
      # Docker
      # -----------------------------

      - name: Build Docker images
        run: docker compose build

      # -----------------------------
      # Login to GitHub Container Registry
      # -----------------------------

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Tag Docker Images
      # -----------------------------

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag placement-portal-backend \
            ghcr.io/s-raiyan/placement-portal-backend:latest

          docker tag placement-portal-student-portal \
            ghcr.io/s-raiyan/placement-portal-student-portal:latest

          docker tag placement-portal-admin-portal \
            ghcr.io/s-raiyan/placement-portal-admin-portal:latest

      # -----------------------------
      # Push Docker Images to GHCR
      # -----------------------------

      - name: Push Backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/s-raiyan/placement-portal-backend:latest

      - name: Push Student Portal image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/s-raiyan/placement-portal-student-portal:latest

      - name: Push Admin Portal image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/s-raiyan/placement-portal-admin-portal:latest